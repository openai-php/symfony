name: Tests

on: ['push', 'pull_request']

permissions: read-all

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: [8.2, 8.3, 8.4, 8.5]
        symfony: [false]
        dependency: [stable]
        include:
          - { php: 8.2, symfony: ^6.4 , dependency: stable }
          - { php: 8.4, symfony: ^7.4, dependency: highest }
          - { php: 8.4, symfony: false, dependency: highest }

    env:
      SYMFONY_REQUIRE: ${{ matrix.symfony }}

    name: Tests P${{ matrix.php }} - SF${{ matrix.symfony }} - ubuntu-latest - ${{ matrix.dependency }}
    steps:

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, zip
          coverage: none
          tools: flex

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4
        with:
          dependency-versions: ${{ matrix.dependency }}

      - name: Integration Tests
        run: php ./vendor/bin/phpunit
